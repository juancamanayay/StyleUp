<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/">
      <img src="imagenes/StyleUP.jpg" alt="StyleUp Logo" style="height: 100px; width: auto" />
      <span class="fw-bold">StyleUp</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarMenu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMenu">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"

        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/productos" routerLinkActive="active">Productos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/ofertas" routerLinkActive="active">Ofertas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/tienda" routerLinkActive="active">Tienda</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/contacto" routerLinkActive="active">Contacto</a>
        </li>
      </ul>

      <ul class="navbar-nav align-items-lg-center gap-lg-2">
        @if (auth.estaAutenticado()) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/mi-cuenta" routerLinkActive="active">
              Hola, {{ auth.obtenerUsuario()?.nombre }}

            <button class="btn btn-outline-light btn-sm ms-2" (click)="cerrarSesion()">

          </li>

            <a class="nav-link" routerLink="/mi-cuenta" routerLinkActive="active">Mi Cuenta</a>
          </li>
